name: Verified Release Artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and package the same build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify frontend
        working-directory: frontend
        env:
          VITE_DATA_MODE: api
          VITE_API_BASE_URL: ''
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify backend
        working-directory: backend
        run: ./mvnw --batch-mode verify
      - name: Verify operational tools
        run: python -m unittest discover -s deploy -p 'test_*.py'
      - name: Package verified outputs without rebuilding
        run: |
          python deploy/release_artifact.py package "$RUNNER_TEMP/knowledgesteps-release"
          python deploy/release_artifact.py verify "$RUNNER_TEMP/knowledgesteps-release"
      - uses: actions/upload-artifact@v4
        with:
          name: knowledgesteps-${{ github.sha }}
          path: ${{ runner.temp }}/knowledgesteps-release/
          if-no-files-found: error
          retention-days: 14
      # Azure installation remains manual; no unbound deployment webhooks.
