# Included from nginx http context. Empty keys skip non-API traffic.
map $uri $ksteps_api_key {
    default "";
    ~^/api/ $binary_remote_addr;
}
map "$request_method:$uri" $ksteps_create_key {
    default "";
    "POST:/api/v1/learning-sessions" $binary_remote_addr;
}
map "$request_method:$uri" $ksteps_login_key {
    default "";
    "POST:/api/v1/auth/admin/login" $binary_remote_addr;
}
limit_req_zone $ksteps_api_key zone=ksteps_api:10m rate=20r/s;
limit_req_zone $ksteps_create_key zone=ksteps_create:1m rate=60r/m;
limit_req_zone $ksteps_login_key zone=ksteps_login:1m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name ksteps.yinbo.online;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ksteps.yinbo.online;
    ssl_certificate /etc/letsencrypt/live/ksteps.yinbo.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ksteps.yinbo.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/knowledgesteps;
    index index.html;
    client_max_body_size 1m;
    limit_req zone=ksteps_api burst=40 nodelay;
    limit_req zone=ksteps_create burst=20 nodelay;
    limit_req zone=ksteps_login burst=5 nodelay;
    limit_req_status 429;
    error_page 429 = @ip_rate_limited;
    location @ip_rate_limited {
        default_type application/json;
        add_header Retry-After "60" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"error":{"code":"IP_RATE_LIMITED","message":"当前网络请求过于频繁，请稍后重试。"}}';
    }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        add_header Cache-Control "no-store" always;
    }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
