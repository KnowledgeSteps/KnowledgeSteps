server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
zhihu:
  access-secret: ${ZHIHU_ACCESS_SECRET:}
spring:
  config:
    import: optional:file:./secrets.properties
  application:
    name: zhihu-learning-backend
  datasource:
    url: ${SQLITE_JDBC_URL:jdbc:sqlite:./data/hackathon.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      connection-init-sql: PRAGMA foreign_keys=ON
      data-source-properties:
        busy_timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: "0"
  sql:
    init:
      mode: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
