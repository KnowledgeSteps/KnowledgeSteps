spring:
  application:
    name: zhihu-learning-backend
  datasource:
    url: ${SQLITE_JDBC_URL:jdbc:sqlite:./data/hackathon.db}
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
